name: Unsigned draw.ai Build

# Manually-triggered, unsigned build for draw.ai forks.
# See doc/BUILDING_FOR_PERSONAL_USE.md.
#
# Needs no repository secrets: signing and notarization are skipped
# (DRAWIO_UNSIGNED), and nothing is published. Installers are attached to
# the workflow run as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        required: true
        default: linux
        options:
          - linux
          - macos
          - windows

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.platform == 'macos' && 'macos-latest' || inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      DRAWIO_UNSIGNED: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Linux packaging tools
        if: ${{ inputs.platform == 'linux' }}
        run: |
          sudo apt-get update && sudo apt-get install -y xz-utils rpm
      - name: Build
        run: |
          npm ci
          npm run sync -- disableUpdate
          if [ "${{ inputs.platform }}" = "windows" ]; then
            npx electron-builder --config electron-builder-win.json --publish never
          else
            # Builds the current platform's targets from the shared config:
            # dmg/zip on macOS, AppImage/deb/rpm on Linux
            npx electron-builder --config electron-builder-linux-mac.json --publish never
          fi
      - name: Verify packaged workspace theme
        run: node build/verify-workspace-theme.mjs
      - name: Verify macOS bundles and disk images
        if: ${{ inputs.platform == 'macos' }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' bundle; do
            codesign --verify --deep --strict "$bundle"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist" | grep -qx ai.draw.desktop
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist" | grep -qx "$(node -p 'require("./package.json").version')"
            test "$(stat -f%z "$bundle/Contents/Resources/app.asar")" -lt 524288000
          done < <(find dist -type d -name 'draw.ai.app' -print0)
          for image in dist/*.dmg; do hdiutil verify "$image"; done
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: draw-ai-${{ inputs.platform }}-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
