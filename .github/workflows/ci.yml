name: CI

on:
  push:
    branches: [main, editor]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript and JSON
        run: |
          for file in src/main/*.js src/workspace/*.js; do node --check "$file"; done
          node --check drawio/src/main/webapp/plugins/workspace-agent.js
          node --check drawio/src/main/webapp/plugins/workspace-explorer.js
          for file in package.json electron-builder-*.json; do jq -e . "$file" >/dev/null; done
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Check patches
        run: |
          git diff --check
          git -C drawio diff --check
