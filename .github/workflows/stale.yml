# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '42 3 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v10
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has been marked as stale because it has not had recent activity. Add current reproduction details if it is still relevant.'
        stale-pr-message: 'This pull request has been marked as stale because it has not had recent activity. Add an update if the work should remain open.'
        stale-issue-label: 'wontfix'
        stale-pr-label: 'wontfix'
        close-issue-label: 'declined'
        days-before-stale: 250
        days-before-close: 14
        exempt-issue-labels: notstale
        exempt-pr-labels: notstale
